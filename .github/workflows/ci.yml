name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The offline suite makes no network calls and needs no keys: the
      # provider is pointed at an unroutable address, and nothing calls it.
      # Tests that need a live model are marked REQUIRES_MODEL and skipped
      # here — they run locally with `tests/run.sh --all`.
      - name: Run the offline test suite
        run: tests/run.sh

      - name: Configuration doctor self-check
        run: python tests/t_doctor.py

      - name: Compile every file
        run: python -m compileall -q .
